[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "operator-guards"
version = "0.1.0"
description = "Standalone port of ED-209 (behaviour) and R2-D2 (capability) operator guards."
requires-python = ">=3.11,<3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/operator_guards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
